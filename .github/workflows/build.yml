name: Build artifact

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with actions-rust-cross
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Pack artifact
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          BIN_PATH="${BIN_DIR}/credinform_cli"
          if [ -f "${BIN_PATH}.exe" ]; then
            BIN_PATH="${BIN_PATH}.exe"
          fi
          ARCHIVE="credinform_cli-${{ matrix.target }}.tar.gz"
          (cd "${BIN_DIR}" && tar czf "${ARCHIVE}" "$(basename "${BIN_PATH}")")
          shasum -a 256 "${BIN_DIR}/${ARCHIVE}" > "${BIN_DIR}/${ARCHIVE%.tar.gz}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: credinform_cli_artifacts_${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/credinform_cli-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/credinform_cli-${{ matrix.target }}.sha256